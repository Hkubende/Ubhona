name: MVP Feature Task
description: Define a bounded MVP task without expanding scope.
title: "MVP Task: "
labels:
  - mvp
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth
        - Onboarding
        - Orders
        - Uploads
        - Dashboard
        - Admin
        - Infra
        - QA
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      placeholder: "What outcome should this task produce?"
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        -
    validations:
      required: true
