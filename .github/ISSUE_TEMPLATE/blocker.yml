name: Blocker
description: Report a production or MVP blocker with concrete evidence.
title: "Blocker: "
labels:
  - blocker
  - needs-evidence
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 Critical
        - P1 High
        - P2 Medium
        - P3 Low
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth
        - Onboarding
        - Orders
        - Uploads
        - Dashboard
        - Admin
        - Infra
        - QA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: "What is blocked?"
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include screenshot, console error, request URL/status, logs, or exact runtime signal.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        -
    validations:
      required: true
