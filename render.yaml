services:
  - type: web
    name: ubhona-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_API_BASE
        value: https://api.ubhona.com
      - key: VITE_STK_API_BASE
        value: https://api.ubhona.com
      - key: VITE_PUBLIC_APP_URL
        value: https://app.ubhona.com
      - key: VITE_SITE_URL
        value: https://app.ubhona.com
      - key: VITE_UPLOAD_PROVIDER
        value: api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: ubhona-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_BASE_URL
        value: https://api.ubhona.com
      - key: FRONTEND_URL
        value: https://app.ubhona.com
      - key: APP_PUBLIC_BASE_URL
        value: https://app.ubhona.com
      - key: QR_BASE_URL
        value: https://app.ubhona.com
      - key: PUBLIC_APP_URL
        value: https://app.ubhona.com
      - key: CORS_ORIGIN
        value: https://app.ubhona.com
      - key: SUPABASE_STORAGE_BUCKET_THUMBNAILS
        value: dish-thumbnails
      - key: SUPABASE_STORAGE_BUCKET_MODELS
        value: dish-models
      - key: SUPABASE_STORAGE_BUCKET_BRANDING
        value: restaurant-branding
      - key: MPESA_ENV
        value: production
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: BILLING_DEFAULT_PROVIDER
        value: manual
      - key: BILLING_MPESA_MODE
        value: live
      - key: WHATSAPP_PROVIDER
        value: meta_cloud
      - key: APP_RUNTIME_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROFILE_ENCRYPTION_KEY
        generateValue: true
      - key: ORDER_TRACKING_SECRET
        generateValue: true
      - key: BILLING_WEBHOOK_SECRET
        generateValue: true
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_TIMEOUT_URL
        sync: false
      - key: MPESA_PARTY_B
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
